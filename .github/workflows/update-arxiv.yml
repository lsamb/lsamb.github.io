name: Update arXiv and publish website

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the publication updater
        run: python -m unittest discover -s tests -v
      - name: Fetch current arXiv publications
        run: python scripts/update_publications.py --site-dir .
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html styles.css favicon.svg profile.jpg publications.json .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
